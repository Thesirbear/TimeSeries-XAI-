#тоже сгенерировал с помощью ии(чтобы улучшить читаемость пред коммитную)
[tool.ruff]
target-version = "py311"  # Замени на свою версию Python
line-length = 100
extend-exclude = [
    "model_files",
    "papers_gits"
]

exclude = ["*.ipynb"]

force-exclude = true


[tool.ruff.lint]
select = [
    "E4",  # Ошибки импортов
    "E7",  # Ошибки стиля
    "E9",  # Синтаксические ошибки
    "F",   # Неиспользуемые переменные, импорты и т.д.
    "I",   # Сортировка импортов
    "B",   # Потенциальные баги
]
